<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>On fait quoi cette semaine ? — Marseille 17→27 août</title>
<meta name="theme-color" content="#0B1E2D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --nuit:#0B1E2D;
  --nuit-2:#122C40;
  --carte:#16344A;
  --calanque:#12808C;
  --azur:#3FC6D4;
  --ocre:#E9A03B;
  --corail:#E4572E;
  --calcaire:#EFE9DC;
  --calcaire-2:#A9BDC9;
  --frame-radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(18,128,140,.35), transparent 60%),
    radial-gradient(900px 500px at -10% 10%, rgba(233,160,59,.14), transparent 55%),
    var(--nuit);
  color:var(--calcaire);
  font-family:'Outfit',system-ui,-apple-system,sans-serif;
  font-weight:300;
  min-height:100vh;
  padding-bottom:110px;
}
h1,h2,h3,.display{font-family:'Bricolage Grotesque','Outfit',sans-serif;font-weight:800;letter-spacing:-.02em;margin:0}
button,input,select,textarea{font-family:inherit;font-size:16px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* ---------- Écran nom ---------- */
#gate{position:fixed;inset:0;z-index:60;background:var(--nuit);display:flex;align-items:center;justify-content:center;padding:24px}
#gate .box{width:100%;max-width:380px}
#gate h1{font-size:clamp(34px,9vw,46px);line-height:.95}
#gate p{color:var(--calcaire-2);font-size:15px;margin:14px 0 22px}
.field{width:100%;background:var(--carte);border:1px solid rgba(63,198,212,.25);color:var(--calcaire);
  border-radius:14px;padding:14px 16px;outline:none}
.field:focus{border-color:var(--azur)}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:600;cursor:pointer}
.btn-main{background:var(--ocre);color:#2A1804;width:100%;margin-top:12px}
.btn-ghost{background:transparent;border:1px solid rgba(239,233,220,.25);color:var(--calcaire)}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);
  background:linear-gradient(var(--nuit) 55%, rgba(11,30,45,.82));
  border-bottom:1px solid rgba(63,198,212,.15)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 0 8px}
.brand h1{font-size:clamp(21px,5.4vw,28px);line-height:1}
.brand h1 em{font-style:normal;color:var(--ocre)}
.who{font-size:12px;color:var(--calcaire-2);white-space:nowrap;background:none;border:0;padding:6px 0}

/* ---------- Bande des jours (signature) ---------- */
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:54px;border-radius:12px;padding:8px 4px 7px;text-align:center;cursor:pointer;
  background:var(--nuit-2);border:1px solid rgba(239,233,220,.08);transition:.18s}
.day .dow{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--calcaire-2)}
.day .num{font-family:'Bricolage Grotesque';font-weight:800;font-size:19px;line-height:1.1}
.day .dot{height:4px;border-radius:2px;margin:5px 6px 0;background:rgba(239,233,220,.12)}
.day .dot i{display:block;height:100%;border-radius:2px;background:var(--azur)}
.day.on{background:var(--calanque);border-color:var(--azur)}
.day.shabbat{background:linear-gradient(180deg,#3A2A16,#241a0f);border-color:rgba(233,160,59,.4)}
.day.shabbat .num{color:var(--ocre)}

/* ---------- Onglets & filtres ---------- */
.tabs{display:flex;gap:6px;padding:0 0 10px}
.tab{flex:1;background:var(--nuit-2);border:1px solid rgba(239,233,220,.1);color:var(--calcaire-2);
  border-radius:12px;padding:9px 6px;font-size:13px;font-weight:500;cursor:pointer}
.tab.on{background:var(--calcaire);color:var(--nuit);border-color:var(--calcaire)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;
  background:var(--nuit-2);border:1px solid rgba(239,233,220,.12);color:var(--calcaire-2)}
.chip.on{background:var(--azur);color:#04222A;border-color:var(--azur);font-weight:600}

/* ---------- Cartes ---------- */
.list{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.card{background:var(--carte);border:1px solid rgba(239,233,220,.08);border-radius:var(--frame-radius);
  padding:14px 14px 12px;animation:pop .25s ease both}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.card .top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card h3{font-size:17px;line-height:1.2}
.cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:600;
  padding:4px 9px;border-radius:999px;white-space:nowrap}
.meta{font-size:13px;color:var(--calcaire-2);margin-top:6px;line-height:1.45}
.meta b{font-weight:600;color:var(--calcaire)}
.votes{display:flex;gap:7px;margin-top:12px}
.vote{flex:1;border-radius:12px;padding:9px 4px;border:1px solid rgba(239,233,220,.14);
  background:var(--nuit-2);color:var(--calcaire-2);font-size:14px;cursor:pointer;transition:.15s}
.vote b{font-weight:600}
.vote.on-oui{background:var(--calanque);border-color:var(--azur);color:#EAFDFF}
.vote.on-bof{background:#4A3A18;border-color:var(--ocre);color:#FFF0D6}
.vote.on-non{background:#4A2118;border-color:var(--corail);color:#FFE3DA}
.who-voted{font-size:12px;color:var(--calcaire-2);margin-top:9px;line-height:1.5}
.who-voted span{color:var(--calcaire)}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}
.sel{flex:1;background:var(--nuit-2);border:1px solid rgba(239,233,220,.14);color:var(--calcaire);
  border-radius:11px;padding:9px 10px;font-size:13.5px}
.del{background:none;border:0;color:var(--calcaire-2);font-size:13px;cursor:pointer;padding:6px}

/* ---------- Planning ---------- */
.planday{border-left:2px solid rgba(63,198,212,.3);padding:0 0 18px 14px;margin-left:6px;position:relative}
.planday:before{content:'';position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--azur)}
.planday.sh:before{background:var(--ocre)}
.planday h3{font-size:16px}
.planday .date{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--calcaire-2)}
.planitem{background:var(--carte);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14.5px}
.planitem small{display:block;color:var(--calcaire-2);font-size:12.5px;margin-top:2px}
.empty{color:var(--calcaire-2);font-size:13.5px;padding:6px 0 0;font-style:italic}

/* ---------- Ajout ---------- */
.fab{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent, var(--nuit) 45%)}
.fab .inner{max-width:760px;margin:0 auto;display:flex;gap:8px}
.fab .btn{flex:1}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(4,12,20,.7);display:none;align-items:flex-end}
#sheet.open{display:flex}
#sheet .panel{width:100%;max-width:760px;margin:0 auto;background:var(--nuit-2);border-radius:22px 22px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(24px)}}
#sheet h2{font-size:22px;margin-bottom:14px}
#sheet .field,#sheet .sel{margin-bottom:9px;width:100%}
.banner{background:rgba(233,160,59,.12);border:1px solid rgba(233,160,59,.3);color:#F5D9A8;
  border-radius:12px;padding:11px 13px;font-size:12.5px;margin:8px 0 2px;line-height:1.5}
.banner.err{background:rgba(228,87,46,.14);border-color:rgba(228,87,46,.45);color:#FFCBBB}
.banner.ok{background:rgba(63,198,212,.1);border-color:rgba(63,198,212,.3);color:#B9EEF4}
.banner code{font-family:ui-monospace,monospace;font-size:11.5px;background:rgba(0,0,0,.3);padding:1px 5px;border-radius:5px}
.banner .btn{margin-top:9px;padding:11px 14px;font-size:14px}
.foot{text-align:center;color:var(--calcaire-2);font-size:12px;padding:26px 0 6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ============ ÉCRAN NOM ============ -->
<div id="gate"><div class="box">
  <h1>On fait quoi<br>cette <em>semaine</em> ?</h1>
  <p>Marseille &amp; la côte — du 17 au 27 août. Propose, vote, et le planning se remplit tout seul.</p>
  <input class="field" id="gname" placeholder="Ton prénom" autocomplete="given-name">
  <button class="btn btn-main" id="gbtn">C'est parti</button>
</div></div>

<!-- ============ HEADER ============ -->
<header><div class="wrap">
  <div class="brand">
    <h1>On fait quoi <em>cette semaine</em> ?</h1>
    <button class="who" id="who"></button>
  </div>
  <div class="strip" id="strip"></div>
  <div class="tabs">
    <button class="tab on" data-view="idees">Les idées</button>
    <button class="tab" data-view="planning">Le planning</button>
  </div>
  <div class="chips" id="chips"></div>
</div></header>

<main class="wrap">
  <div id="banner"></div>
  <div class="list" id="list"></div>
  <div class="foot" id="foot"></div>
</main>

<!-- ============ BARRE BAS ============ -->
<div class="fab"><div class="inner">
  <button class="btn btn-main" id="add">+ Ajouter une idée</button>
  <button class="btn btn-ghost" id="copy">Copier</button>
</div></div>

<!-- ============ FORMULAIRE ============ -->
<div id="sheet"><div class="panel">
  <h2>Nouvelle idée</h2>
  <input class="field" id="f-title" placeholder="Quoi ? ex : Kayak dans la calanque de Sormiou">
  <select class="sel" id="f-cat"></select>
  <input class="field" id="f-place" placeholder="Où ? ex : Cassis (45 min de Marseille)">
  <input class="field" id="f-note" placeholder="Détail utile : horaires, prix, poussette…">
  <select class="sel" id="f-day"></select>
  <button class="btn btn-main" id="f-save">Ajouter l'idée</button>
  <button class="btn btn-ghost" id="f-cancel" style="width:100%;margin-top:8px">Annuler</button>
</div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* =========================================================================
   Projet Firebase : minta-126b4 — config déjà en place.
   Il reste à publier les règles Firestore sur le chemin ofq_trips (voir chat).
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBQFA9hpbUiW-ypGoK309svuXd1LMRsRWI",
  authDomain: "minta-126b4.firebaseapp.com",
  projectId: "minta-126b4",
  storageBucket: "minta-126b4.firebasestorage.app",
  messagingSenderId: "116228959256",
  appId: "1:116228959256:web:c8280ed36eb8f918bea76d"
};
const TRIP_ID = "marseille-2026";
/* ========================================================================= */

const CATS = {
  plage:     {label:"Plage",       bg:"#E9A03B", fg:"#2A1804"},
  aquatique: {label:"Aquatique",   bg:"#3FC6D4", fg:"#04222A"},
  exterieur: {label:"Extérieur",   bg:"#7FB069", fg:"#0E2109"},
  interieur: {label:"Intérieur",   bg:"#C58BD6", fg:"#26102D"},
  village:   {label:"Village",     bg:"#E8776A", fg:"#2E0F0B"},
  foot:      {label:"Foot / OM",   bg:"#5AA9E6", fg:"#04182A"},
  resto:     {label:"Resto",       bg:"#EFE9DC", fg:"#16344A"},
  logistique:{label:"Logistique",  bg:"#94A7B3", fg:"#0B1E2D"}
};
const DAYS = [];
for(let d=17; d<=27; d++){
  const date = new Date(2026,7,d);
  const dow = ["dim","lun","mar","mer","jeu","ven","sam"][date.getDay()];
  DAYS.push({key:String(d), num:d, dow, shabbat:(d===21||d===22)});
}
const DAY_LABEL = k => { const d=DAYS.find(x=>x.key===k); return d ? `${d.dow}. ${d.num} août` : ""; };

let me = localStorage.getItem('ofq_user') || "";
let items = [];
let view = "idees", filterCat = "all", filterDay = null;
let db = null, LOCAL = !firebaseConfig.apiKey;

/* ---------- Stockage ---------- */
function localLoad(){ try{ return JSON.parse(localStorage.getItem('ofq_items')||"[]"); }catch(e){ return []; } }
function localSave(){ localStorage.setItem('ofq_items', JSON.stringify(items)); }

function setBanner(html){ document.getElementById('banner').innerHTML = html; }

function fallback(reason){
  LOCAL = true; items = localLoad(); render();
  setBanner(`<div class="banner err"><b>Personne d'autre ne voit tes idées.</b><br>
    ${reason}<br>En attendant, tes idées restent sur cet appareil.</div>`);
}

function start(){
  if(!firebaseConfig.apiKey || !firebaseConfig.projectId){
    return fallback(`Le bloc <code>firebaseConfig</code> en haut de <code>index.html</code> est encore vide. Colle celui de ta console Firebase, puis republie le fichier.`);
  }
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }catch(e){ return fallback(`Firebase n'a pas démarré : <code>${esc(e.message)}</code>`); }

  db.collection('ofq_trips').doc(TRIP_ID).collection('activities')
    .orderBy('createdAt','asc')
    .onSnapshot(snap=>{
      LOCAL = false;
      items = snap.docs.map(d=>({id:d.id, ...d.data()}));
      render();
      showShared();
    }, err=>{
      console.error(err);
      fallback(`Firestore a refusé la lecture : <code>${esc(err.code||'')}</code>. Vérifie que la base Firestore est bien créée et que les règles autorisent <code>ofq_trips</code>.`);
    });
}

/* Idées saisies avant la connexion → on propose de les envoyer à tout le monde */
function showShared(){
  const local = localLoad();
  const orphans = local.filter(l => !items.some(i => i.title === l.title));
  if(!orphans.length){
    setBanner(`<div class="banner ok">Partagé ✓ — tout le monde voit les mêmes idées, en direct.</div>`);
    return;
  }
  setBanner(`<div class="banner">Partagé ✓ — mais <b>${orphans.length} idée(s)</b> saisies avant la connexion sont restées sur cet appareil.
    <button class="btn btn-main" id="imp">Envoyer ces ${orphans.length} idées à tout le monde</button></div>`);
  document.getElementById('imp').onclick = ()=>{
    document.getElementById('imp').textContent = 'Envoi…';
    const batch = db.batch();
    const col = db.collection('ofq_trips').doc(TRIP_ID).collection('activities');
    orphans.forEach(o=>{
      batch.set(col.doc(), {
        title:o.title, cat:o.cat, place:o.place||'', note:o.note||'',
        day:o.day||'', votes:o.votes||{}, author:o.author||me, createdAt:o.createdAt||Date.now()
      });
    });
    batch.commit().then(()=>{
      localStorage.removeItem('ofq_items');
      setBanner(`<div class="banner ok">Envoyé ✓ — les ${orphans.length} idées sont maintenant visibles par tout le monde.</div>`);
    }).catch(e=>{
      setBanner(`<div class="banner err">Envoi refusé : <code>${esc(e.code||e.message)}</code>. Les règles Firestore n'autorisent pas l'écriture.</div>`);
    });
  };
}
function addItem(o){
  const doc = {...o, votes:{}, author:me, createdAt: Date.now()};
  if(LOCAL){ items.push({id:'l'+Date.now()+Math.random(), ...doc}); localSave(); render(); }
  else db.collection('ofq_trips').doc(TRIP_ID).collection('activities').add(doc);
}
function patchItem(id, data){
  if(LOCAL){ const it = items.find(x=>x.id===id); Object.assign(it, data); localSave(); render(); }
  else db.collection('ofq_trips').doc(TRIP_ID).collection('activities').doc(id).update(data);
}
function removeItem(id){
  if(LOCAL){ items = items.filter(x=>x.id!==id); localSave(); render(); }
  else db.collection('ofq_trips').doc(TRIP_ID).collection('activities').doc(id).delete();
}

/* ---------- Idées de départ ---------- */
const SEED = [
 ["Calanques en bateau depuis Cassis","aquatique","Cassis — 45 min de route","3 calanques, ~1h de bateau. Réserver le matin, mer plus calme."],
 ["Kayak dans la calanque de Sormiou","aquatique","Marseille 9e","À voir avec l'âge des garçons — sinon baignade depuis la plage."],
 ["Île du Frioul en navette","aquatique","Départ Vieux-Port","20 min de bateau, criques et grands espaces pour courir."],
 ["Château d'If","aquatique","Départ Vieux-Port","Court, spectaculaire, bien avec des enfants qui aiment les histoires."],
 ["Aqualand Fréjus","aquatique","Fréjus — 1h30","Journée entière, prévoir tôt le matin pour la queue."],
 ["Plage des Catalans","plage","Marseille 7e","La plus proche du centre, sable, poussette OK."],
 ["Plages du Prado","plage","Marseille 8e","Grandes pelouses + aires de jeux juste derrière."],
 ["Plage de la Pointe Rouge","plage","Marseille 8e","Eau peu profonde, parfaite pour les petits."],
 ["Plage du Bestouan","plage","Cassis","Eau très claire, galets — prévoir des chaussons."],
 ["Notre-Dame de la Garde","exterieur","Marseille","Monter en petit train depuis le Vieux-Port, ça évite la côte."],
 ["Parc Borély","exterieur","Marseille 8e","Aires de jeux, poneys, grand lac. Valeur sûre fin de journée."],
 ["Vallon des Auffes au coucher du soleil","exterieur","Marseille 7e","Mini port de carte postale, 20 min sur place suffisent."],
 ["Marché aux poissons du Vieux-Port","exterieur","Marseille 1er","Tous les matins vers 8h-13h. Les garçons vont adorer."],
 ["Parc du Mugel","exterieur","La Ciotat — 40 min","Jardin botanique en bord de mer, ombragé."],
 ["MuCEM","interieur","Marseille 2e","La passerelle et le fort valent autant que les expos."],
 ["Musée Cosquer","interieur","Villa Méditerranée","Réplique de la grotte en petit véhicule — top les jours de mistral."],
 ["Parc de trampolines / jeux couverts","interieur","Marseille","Plan B jour de pluie ou grosse chaleur."],
 ["Cinéma en famille","interieur","Marseille","Séance clim l'après-midi si la journée est trop chaude."],
 ["Cassis et son port","village","45 min","Se garer en haut, descendre à pied. Glace obligatoire."],
 ["Bormes-les-Mimosas","village","1h30","Ruelles fleuries, ça grimpe — porte-bébé conseillé."],
 ["Saint-Tropez","village","2h","Journée complète, viser tôt pour le parking."],
 ["Antibes et le Fort Carré","village","2h30","Bien à combiner avec le trajet depuis Nice."],
 ["Saint-Paul-de-Vence","village","2h30","Village d'artistes, pavés — porte-bébé plutôt que poussette."],
 ["Villefranche-sur-Mer","village","2h45","Petite plage abritée juste sous le village."],
 ["Èze village","village","3h","Montée raide : porte-bébé obligatoire, pas de poussette."],
 ["Aix-en-Provence","village","40 min","Cours Mirabeau, fontaines, marché le matin."],
 ["Match de l'OM au Vélodrome","foot","Marseille 8e — dim. 23 août","Billets à prendre. Vérifier l'heure du coup d'envoi."],
 ["Visite du stade Vélodrome","foot","Marseille 8e","Vestiaires + pelouse, ~1h. Plan B si pas de billets pour le match."],
 ["Boutique officielle OM","foot","Vieux-Port ou Vélodrome","Maillots floqués pour les garçons."],
 ["Récupérer la voiture de location","logistique","Aéroport de Nice — lun. 17 août","Sièges auto à confirmer à la réservation."],
 ["Route Nice → Marseille avec arrêts","logistique","lun. 17 ou mar. 18 août","Compter 2h30 sans arrêt, le double avec les villages."],
 ["Bouillabaisse ou panisses en famille","resto","Marseille","Un vrai repas du sud, un soir où tout le monde a la forme."]
];
function seed(){ SEED.forEach(([title,cat,place,note])=>addItem({title,cat,place,note,day:""})); }

/* ---------- Rendu ---------- */
const $ = s => document.querySelector(s);

function score(it){
  const v = Object.values(it.votes||{});
  return {oui:v.filter(x=>x==='oui').length, bof:v.filter(x=>x==='bof').length, non:v.filter(x=>x==='non').length};
}
function names(it, val){
  return Object.entries(it.votes||{}).filter(([,v])=>v===val).map(([n])=>n);
}

function renderStrip(){
  $('#strip').innerHTML = DAYS.map(d=>{
    const n = items.filter(i=>i.day===d.key).length;
    const w = Math.min(100, n*25);
    return `<div class="day ${filterDay===d.key?'on':''} ${d.shabbat?'shabbat':''}" data-day="${d.key}">
      <div class="dow">${d.dow}</div><div class="num">${d.num}</div>
      <div class="dot"><i style="width:${w}%"></i></div></div>`;
  }).join('');
  $('#strip').querySelectorAll('.day').forEach(el=>el.onclick=()=>{
    filterDay = filterDay===el.dataset.day ? null : el.dataset.day;
    if(filterDay) view='idees', document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.view==='idees'));
    render();
  });
}
function renderChips(){
  const all = `<div class="chip ${filterCat==='all'?'on':''}" data-cat="all">Tout (${items.length})</div>`;
  $('#chips').innerHTML = all + Object.entries(CATS).map(([k,c])=>{
    const n = items.filter(i=>i.cat===k).length;
    return `<div class="chip ${filterCat===k?'on':''}" data-cat="${k}">${c.label} (${n})</div>`;
  }).join('');
  $('#chips').querySelectorAll('.chip').forEach(el=>el.onclick=()=>{ filterCat=el.dataset.cat; render(); });
}

function card(it){
  const s = score(it), c = CATS[it.cat]||CATS.exterieur, mv = (it.votes||{})[me];
  const dayOpts = ['<option value="">Pas encore casé</option>']
    .concat(DAYS.map(d=>`<option value="${d.key}" ${it.day===d.key?'selected':''}>${d.dow}. ${d.num} août${d.shabbat?' · Chabbat':''}</option>`)).join('');
  const line = ['oui','bof','non'].map(v=>{
    const ns = names(it,v); if(!ns.length) return '';
    const icon = v==='oui'?'👍':v==='bof'?'🤷':'👎';
    return `${icon} <span>${ns.join(', ')}</span>`;
  }).filter(Boolean).join(' &nbsp;·&nbsp; ');
  return `<div class="card">
    <div class="top">
      <h3>${esc(it.title)}</h3>
      <span class="cat" style="background:${c.bg};color:${c.fg}">${c.label}</span>
    </div>
    <div class="meta">${it.place?`<b>${esc(it.place)}</b><br>`:''}${esc(it.note||'')}</div>
    <div class="votes">
      <button class="vote ${mv==='oui'?'on-oui':''}" data-v="oui" data-id="${it.id}">👍 <b>${s.oui}</b></button>
      <button class="vote ${mv==='bof'?'on-bof':''}" data-v="bof" data-id="${it.id}">🤷 <b>${s.bof}</b></button>
      <button class="vote ${mv==='non'?'on-non':''}" data-v="non" data-id="${it.id}">👎 <b>${s.non}</b></button>
    </div>
    ${line?`<div class="who-voted">${line}</div>`:'<div class="who-voted">Personne n\'a encore voté.</div>'}
    <div class="row">
      <select class="sel" data-day-for="${it.id}">${dayOpts}</select>
      ${it.author===me?`<button class="del" data-del="${it.id}">Supprimer</button>`:`<span class="del">par ${esc(it.author||'?')}</span>`}
    </div>
  </div>`;
}

function renderIdees(){
  let list = items.slice();
  if(filterCat!=='all') list = list.filter(i=>i.cat===filterCat);
  if(filterDay) list = list.filter(i=>i.day===filterDay);
  list.sort((a,b)=>{const A=score(a),B=score(b);return (B.oui-B.non)-(A.oui-A.non)});
  if(!items.length){
    $('#list').innerHTML = `<div class="card"><h3>Rien pour l'instant</h3>
      <div class="meta">Charge les 32 idées de départ (Marseille, les calanques, les villages de la côte, l'OM), puis chacun vote.</div>
      <button class="btn btn-main" id="seed">Charger les idées de départ</button></div>`;
    $('#seed').onclick = seed; return;
  }
  if(!list.length){ $('#list').innerHTML = `<div class="empty">Aucune idée dans ce filtre. Ajoute la première.</div>`; return; }
  $('#list').innerHTML = list.map(card).join('');
  $('#list').querySelectorAll('.vote').forEach(b=>b.onclick=()=>{
    const it = items.find(x=>x.id===b.dataset.id);
    const votes = {...(it.votes||{})};
    if(votes[me]===b.dataset.v) delete votes[me]; else votes[me]=b.dataset.v;
    patchItem(it.id,{votes});
  });
  $('#list').querySelectorAll('[data-day-for]').forEach(s=>s.onchange=()=>patchItem(s.dataset.dayFor,{day:s.value}));
  $('#list').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ if(confirm('Supprimer cette idée ?')) removeItem(b.dataset.del); });
}

function renderPlanning(){
  const html = DAYS.map(d=>{
    const day = items.filter(i=>i.day===d.key)
      .sort((a,b)=>(score(b).oui)-(score(a).oui));
    const inner = day.length
      ? day.map(i=>{const s=score(i);return `<div class="planitem">${esc(i.title)}
          <small>${CATS[i.cat].label}${i.place?' · '+esc(i.place):''} — 👍 ${s.oui} 🤷 ${s.bof} 👎 ${s.non}</small></div>`}).join('')
      : `<div class="empty">${d.shabbat?'Chabbat — on ne planifie rien.':'Rien de calé. Choisis une idée et donne-lui ce jour.'}</div>`;
    return `<div class="planday ${d.shabbat?'sh':''}">
      <div class="date">${d.dow}. ${d.num} août${d.shabbat?' · Chabbat':''}</div>
      <h3>${d.num===17?'Arrivée à Nice':d.num===27?'Retour':''}</h3>${inner}</div>`;
  }).join('');
  const off = items.filter(i=>!i.day).length;
  $('#list').innerHTML = html + (off?`<div class="empty">${off} idée(s) pas encore casée(s) dans un jour.</div>`:'');
}

function render(){
  renderStrip(); renderChips();
  view==='idees' ? renderIdees() : renderPlanning();
  $('#who').textContent = me + ' · changer';
  $('#foot').textContent = LOCAL
    ? "Mode local — les idées restent sur cet appareil."
    : "Base partagée : " + firebaseConfig.projectId;
}
function esc(s){ return String(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

/* ---------- Interactions ---------- */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  view = t.dataset.view; filterDay = null;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  render();
});
$('#add').onclick = ()=>{
  $('#f-cat').innerHTML = Object.entries(CATS).map(([k,c])=>`<option value="${k}">${c.label}</option>`).join('');
  $('#f-day').innerHTML = ['<option value="">Pas encore casé</option>']
    .concat(DAYS.map(d=>`<option value="${d.key}">${d.dow}. ${d.num} août</option>`)).join('');
  $('#sheet').classList.add('open'); $('#f-title').focus();
};
$('#f-cancel').onclick = ()=>$('#sheet').classList.remove('open');
$('#f-save').onclick = ()=>{
  const title = $('#f-title').value.trim();
  if(!title){ $('#f-title').focus(); return; }
  addItem({title, cat:$('#f-cat').value, place:$('#f-place').value.trim(), note:$('#f-note').value.trim(), day:$('#f-day').value});
  ['#f-title','#f-place','#f-note'].forEach(s=>$(s).value='');
  $('#sheet').classList.remove('open');
};
$('#copy').onclick = ()=>{
  let t = "On fait quoi cette semaine ? — Marseille 17→27 août\n\n";
  DAYS.forEach(d=>{
    const day = items.filter(i=>i.day===d.key);
    t += `${d.dow}. ${d.num} août${d.shabbat?' (Chabbat)':''}\n`;
    t += day.length ? day.map(i=>`  · ${i.title}${i.place?' — '+i.place:''}`).join('\n')+'\n' : "  —\n";
  });
  navigator.clipboard.writeText(t).then(()=>{ $('#copy').textContent='Copié'; setTimeout(()=>$('#copy').textContent='Copier',1500); });
};
$('#who').onclick = ()=>{ $('#gname').value = me; $('#gate').style.display='flex'; };
$('#gbtn').onclick = ()=>{
  const n = $('#gname').value.trim();
  if(!n){ $('#gname').focus(); return; }
  me = n; localStorage.setItem('ofq_user', me);
  $('#gate').style.display='none'; render();
};
$('#gname').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#gbtn').click(); });

if(me){ $('#gate').style.display='none'; }
start();
</script>
</body>
</html>
